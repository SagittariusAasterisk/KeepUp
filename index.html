<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic setup so browsers display text and layout correctly on mobile screens -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Tap Game</title>
    
    <!-- External tools we are borrowing to make our app work -->
    <!-- 1. PeerJS: Handles the peer-to-peer connection so we don't need a custom backend -->
    <script src="https://jsdelivr.net"></script>
    <!-- 2. QRCode.js: Turns text links into a scannable QR code image automatically -->
    <script src="https://cloudflare.com"></script>
    <!-- 3. TailwindCSS: A styling framework that makes buttons and backgrounds look nice -->
    <script src="https://tailwindcss.com"></script>
    
    <!-- Custom styling to force pure yellow and pure black screens during gameplay -->
    <style>
        .bg-yellow { background-color: #facc15 !important; }
        .bg-black { background-color: #000000 !important; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans transition-colors duration-150 select-none">

    <!-- ==================== SCREEN 1: LOBBY SCREEN ==================== -->
    <!-- This screen handles setting up the game, showing the QR code, and waiting for players -->
    <div id="lobby-screen" class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
        <h1 class="text-3xl font-bold mb-6">P2P Tap Game</h1>
        
        <!-- Action buttons shown when first opening the web app -->
        <div id="setup-buttons" class="space-y-4">
            <button onclick="initHost()" class="w-64 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition">
                Create Game (Host)
            </button>
        </div>

        <!-- Container where the generated QR code will show up. Hidden by default -->
        <div id="qr-container" class="hidden flex flex-col items-center mt-6 bg-white p-6 rounded-xl shadow-2xl">
            <div id="qrcode"></div>
            <p class="text-slate-800 font-medium mt-4 text-sm">Scan with other phones to join</p>
        </div>

        <!-- Status logs to tell you what the app is currently doing (Great for debugging!) -->
        <div id="status-area" class="mt-6 text-slate-400">
            <p id="peer-status">Tap the button above to start.</p>
            <p id="connected-count" class="hidden mt-2 font-bold text-green-400">Connected Players: 0</p>
            <!-- The Host clicks this button once all players have successfully scanned and joined -->
            <button id="start-btn" onclick="startGame()" class="hidden mt-6 w-64 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition">
                Start Game
            </button>
        </div>
    </div>

    <!-- ==================== SCREEN 2: GAMEPLAY SCREEN ==================== -->
    <!-- This full-screen layer turns black/yellow and registers touch inputs anywhere -->
    <div id="game-screen" class="hidden fixed inset-0 flex flex-col items-center justify-center cursor-pointer touch-none" onclick="handleScreenTap()">
        <div id="game-ui" class="text-center pointer-events-none">
            <!-- Displays the running 30 second countdown timer -->
            <p id="timer" class="text-6xl font-black drop-shadow-md mb-2"></p>
            <!-- Tells the player whether they should tap or wait -->
            <p id="game-instruction" class="text-xl opacity-75 font-semibold"></p>
        </div>
    </div>

    <!-- ==================== SCREEN 3: RESULTS SCREEN ==================== -->
    <!-- Shows the total score and allows restarting the game -->
    <div id="results-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-4 text-center">
        <h1 class="text-4xl font-extrabold mb-2 text-yellow-400">Game Over!</h1>
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl max-w-sm w-full my-6 border border-slate-700">
            <p class="text-slate-400 uppercase tracking-wider text-sm font-bold">Total Taps</p>
            <p id="final-score" class="text-7xl font-black text-white my-2">0</p>
        </div>
        <!-- Only visible on the Host phone to prevent guests from messing up a restart -->
        <button id="restart-btn" onclick="restartGame()" class="hidden w-64 bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold py-4 px-6 rounded-xl shadow-lg transition text-lg">
            🔄 Play Again
        </button>
        <!-- Visible on client/guest phones while they wait for the Host to press restart -->
        <p id="client-wait-msg" class="hidden text-slate-400 animate-pulse">Waiting for host to restart...</p>
    </div>

    <!-- ==================== JAVASCRIPT GAME LOGIC ==================== -->
    <script>
        // Global network variables to keep track of connection status
        let peer = null;            // Holds our main connection engine object
        let connections = [];       // List used by Host to store all connected guest phones
        let hostConnection = null;  // Connection slot used by guest phones to talk back to Host
        let isHost = false;         // Remembers if this specific phone is the manager (True) or a guest (False)
        let myId = "";              // Our phone's unique randomized ID from PeerJS

        // Global game variables to track current state
        let activePlayerId = null;  // Remembers which unique phone ID is currently allowed to be YELLOW
        let score = 0;              // Tracks total successful yellow screen taps during the game
        let gameTimer = null;       // Holds the physical 1-second counting clock logic
        let timeLeft = 30;          // Standard 30 second game length
        let isGameActive = false;   // Flags if a match is actively happening right now

        // AUTOMATIC CHECK ON LOAD: Sees if a phone opened the link via a scanned QR code
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search); // Look at the browser URL bar
            const targetHostId = urlParams.get('join');                    // Pull the "?join=XYZ" ID out of it
            if (targetHostId) {                                            // If an ID exists, this phone is a guest!
                initClient(targetHostId);                                  // Automatically initiate client connection
            }
        };

        // Configuration Object: Tells PeerJS how to safely connect through routers and carrier firewalls
        const peerConfig = {
            host: 'peerjs.com',                                            // Uses the free public connection directory
            port: 443,                                                     // Standard secure web connection port
            path: '/',                                                     // Root directory path
            secure: true,                                                  // Force HTTPS connection standard
            config: {
                'iceServers': [                                            // Global address finders managed by Google
                    { url: 'stun:://google.com' },
                    { url: 'stun:://google.com' }
                ]
            }
        };

        // --- HOST CODE (Runs on the phone creating the room) ---
        function initHost() {
            isHost = true; // Mark this device as the game host manager
            document.getElementById('setup-buttons').classList.add('hidden'); // Hide the setup button
            document.getElementById('peer-status').innerText = "[DEBUG] Contacting PeerJS directory server..."; // Update status

            // Initialize PeerJS connection framework using our secure server settings rules
            peer = new Peer(peerConfig);

            // Triggered when PeerJS successfully talks to the directory and assigns us a unique lobby ID
            peer.on('open', (id) => {
                myId = id; // Store our unique identifier
                document.getElementById('peer-status').innerText = "Lobby open! Awaiting network connections...";
                document.getElementById('qr-container').classList.remove('hidden'); // Display the QR code container box
                document.getElementById('connected-count').classList.remove('hidden'); // Display player counter text
                
                // Construct the link that other phones need to visit to join this exact room
                const joinUrl = `${window.location.origin}${window.location.pathname}?join=${id}`;
                
                // Clear out any old QR codes that might have been rendered previously
                document.getElementById("qrcode").innerHTML = "";
                // Use the tool library to draw a fresh QR code onto our screen pointing to our join URL
                new QRCode(document.getElementById("qrcode"), {
                    text: joinUrl,
                    width: 200,
                    height: 200
                });
            });

            // Triggered whenever a new phone scans the QR code and requests to enter our lobby room
            peer.on('connection', (conn) => {
                document.getElementById('peer-status').innerText = "[DEBUG] Incoming connection detected! Handshaking...";
                connections.push(conn); // Save this new client connection into our storage array list
                updateConnectedCount(); // Recalculate how many people are playing
                document.getElementById('start-btn').classList.remove('hidden'); // Show the "Start Game" play button

                // Listen for messages/taps sent specifically from this incoming phone
                conn.on('data', (data) => handleIncomingData(data, conn.peer));
                
                // Handle what happens if a player closes their tab or drops signal
                conn.on('close', () => {
                    connections = connections.filter(c => c.peer !== conn.peer); // Remove them from our list
                    updateConnectedCount(); // Update display counter
                });
            });

            // Catch network configuration errors and show them directly on screen for debugging
            peer.on('error', (err) => {
                document.getElementById('peer-status').innerText = `[NETWORK ERROR] ${err.type}: ${err.message}`;
            });
        }

        // Host helper tool to refresh the UI text showing how many phones are synced together
        function updateConnectedCount() {
            document.getElementById('connected-count').innerText = `Connected Players: ${connections.length + 1}`;
        }

        // --- CLIENT CODE (Runs on phones that scan the QR code) ---
        function initClient(hostId) {
            isHost = false; // Mark this device as a client guest player
            document.getElementById('setup-buttons').classList.add('hidden'); // Hide starter UI elements
            document.getElementById('peer-status').innerText = "[DEBUG] Registering client with directory server...";

            // Initialize PeerJS framework using our secure server settings rules
            peer = new Peer(peerConfig);

            // Triggered when the guest successfully registers with the global directory system
            peer.on('open', (id) => {
                myId = id; // Remember our local phone's random identity string
                document.getElementById('peer-status').innerText = `[DEBUG] Local ID ready. Reaching out to host room: ${hostId}`;
                
                // Dial out to connect directly to the Host's ID link code
                hostConnection = peer.connect(hostId);

                // Triggered when our connection line directly links up with the Host phone successfully
                hostConnection.on('open', () => {
                    document.getElementById('peer-status').innerText = "Connected to host! Waiting for match setup...";
                });

                // Listen for game commands/timer changes broadcasted down from the Host phone
                hostConnection.on('data', (data) => handleIncomingData(data, hostId));
            });

            // Catch network errors on guest phone and log them out visibly
            peer.on('error', (err) => {
                document.getElementById('peer-status').innerText = `[CLIENT ERROR] ${err.type}: ${err.message}`;
            });
        }

        // --- DATA HUB ROUTING (Handles sending/receiving messages across phones) ---
        
        // Host helper tool to blast a message command pack out to EVERY single connected guest phone at once
        function broadcast(data) {
            connections.forEach(conn => {
                if (conn.open) conn.send(data); // If connection is alive, send the data payload
            });
        }

        // Interprets incoming message payloads and routes them to correct visual rules
        function handleIncomingData(data, senderId) {
            if (data.type === 'START_GAME') {
                setupGameUI(); // Switch from lobby screen layouts to full-screen tap mode
            } 
            else if (data.type === 'UPDATE_STATE') {
                updateVisualState(data.activePlayerId, data.timeLeft); // Adjust screens to black or yellow based on parameters
            } 
            else if (data.type === 'TAP_REGISTERED' && isHost) {
                // Security check: Only record a score tap if game is active, and the sender is the allowed yellow phone
                if (isGameActive && senderId === activePlayerId) {
                    score++; // Add a point to score counter
                    pickNextPlayer(); // Randomize who gets the yellow screen next
                }
            } 
            else if (data.type === 'GAME_OVER') {
                showResults(data.score); // Match is finished, switch layouts to display final stats
            }
        }

        // --- SYSTEM ENGINE RULES (The actual game flow) ---
        
        // Kicks off a brand new game match (Can only ever be triggered by the Host phone)
        function startGame() {
            if (!isHost) return; // Block guests from running this engine sequence
            score = 0;           // Reset points to zero
            timeLeft = 30;       // Reset timer limit back to 30 seconds
            isGameActive = true; // Turn on match status flag

            broadcast({ type: 'START_GAME' }); // Tell all guest devices to open their game screens
            setupGameUI();                     // Open the game screen layout on Host device
            pickNextPlayer();                  // Assign the first random yellow phone

            // Start a real clock loop that runs once every 1,000 milliseconds (1 second)
            gameTimer = setInterval(() => {
                timeLeft--; // Subtract 1 second from counter
                
                if (timeLeft  c.peer)];
            let nextPlayer;
            
            // Loop code to ensure we don't pick the same phone twice in a row if there are multiple devices
            do {
                nextPlayer = allPlayers[Math.floor(Math.random() * allPlayers.length)];
            } while (nextPlayer === activePlayerId && allPlayers.length > 1);

            activePlayerId = nextPlayer; // Save selected target phone identity
            broadcastState(); // Instantly update game visual modes
        }

        // Host helper tool to compile status values and send them down the wire to sync players
        function broadcastState() {
            const statePayload = {
                type: 'UPDATE_STATE',
                activePlayerId: activePlayerId,
                timeLeft: timeLeft
            };
            broadcast(statePayload); // Send to all guests
            updateVisualState(activePlayerId, timeLeft); // Update local Host screen look
        }

        // Layout UI manager tool to hide menus and show the raw touch canvas screen setup
        function setupGameUI() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
        }

        // Controls screen background swaps based on whether this phone matches the target active ID
        function updateVisualState(currentActiveId, currentTime) {
            const gameScreen = document.getElementById('game-screen');
            const timerEl = document.getElementById('timer');
            const instEl = document.getElementById('game-instruction');

            timerEl.innerText = currentTime; // Update the digital clock number onscreen

            if (myId === currentActiveId) {
                // If OUR unique ID matches the active target, paint the layout bright yellow!
                document.body.className = "bg-yellow text-slate-950 font-sans transition-colors duration-150 select-none";
                timerEl.classList.remove('text-white');
                timerEl.classList.add('text-slate-950');
                instEl.innerText = "TAP ME!";
            } else {
                // Otherwise, keep the background pitch black and tell the player to wait
                document.body.className = "bg-black text-white font-sans transition-colors duration-150 select-none";
                timerEl.classList.remove('text-slate-950');
                timerEl.classList.add('text-white');
                instEl.innerText = "Wait for yellow...";
            }
        }

        // Capture touch taps anywhere on the canvas screen area
        function handleScreenTap() {
            if (myId === activePlayerId) { // Check if it's currently our turn to be yellow
                if (isHost) {
                    score++; // Directly add score if we are host
                    pickNextPlayer(); // Shift color to next phone
                } else {
                    // Guests send a packet down the network data wire instructing the Host to count the point
                    hostConnection.send({ type: 'TAP_REGISTERED' });
                }
            }
        }

        // Displays final game results layout panel across screen properties
        function showResults(finalScore) {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = finalScore;
            
            // Re-normalize basic system themes to standard slate gray look
            document.body.className = "bg-slate-900 text-white font-sans select-none";

            if (isHost) {
                document.getElementById('restart-btn').classList.remove('hidden'); // Show blue control restart button to Host
                document.getElementById('client-wait-msg').classList.add('hidden');
            } else {
                document.getElementById('restart-btn').classList.add('hidden');
                document.getElementById('client-wait-msg').classList.remove('hidden'); // Force guests to wait for action command
            }
        }

        // Restarts the logic cycle sequence if clicked from the master Host interface
        function restartGame() {
            if (isHost) {
                startGame(); // Fire up a brand new match sequence
            }
        }
    </script>
</body>
</html>
